<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>🔍 محلل ملاحظات الزائر السري - النسخة النهائية</title>
    
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #1e3c72 0%, #2a5298 100%);
            min-height: 100vh;
            padding: 20px;
        }
        
        .container {
            max-width: 1400px;
            margin: 0 auto;
            background: white;
            border-radius: 20px;
            box-shadow: 0 20px 60px rgba(0,0,0,0.3);
            overflow: hidden;
        }
        
        .header {
            background: linear-gradient(135deg, #1e3c72 0%, #2a5298 100%);
            color: white;
            padding: 40px;
            text-align: center;
        }
        
        .header h1 {
            font-size: 2.5em;
            margin-bottom: 10px;
        }
        
        .content {
            padding: 40px;
        }
        
        .info-box {
            background: #fff3cd;
            border-right: 4px solid #ffc107;
            padding: 20px;
            border-radius: 10px;
            margin-bottom: 30px;
        }
        
        .info-box h3 {
            color: #856404;
            margin-bottom: 15px;
        }
        
        .info-box strong {
            color: #dc3545;
        }
        
        .example-btn {
            background: #4CAF50;
            color: white;
            border: none;
            padding: 12px 30px;
            border-radius: 10px;
            cursor: pointer;
            font-size: 1em;
            font-weight: bold;
            margin-top: 15px;
            transition: all 0.3s;
        }
        
        .example-btn:hover {
            background: #45a049;
            transform: translateY(-2px);
        }
        
        #notesInput {
            width: 100%;
            min-height: 400px;
            padding: 15px;
            border: 2px solid #ddd;
            border-radius: 10px;
            font-family: 'Courier New', monospace;
            font-size: 1em;
            resize: vertical;
        }
        
        #notesInput:focus {
            outline: none;
            border-color: #2a5298;
        }
        
        .stats {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 20px;
            margin: 30px 0;
            display: none;
        }
        
        .stats.show {
            display: grid;
        }
        
        .stat-card {
            background: linear-gradient(135deg, #1e3c72 0%, #2a5298 100%);
            color: white;
            padding: 30px;
            border-radius: 15px;
            text-align: center;
        }
        
        .stat-number {
            font-size: 3em;
            font-weight: bold;
        }
        
        .preview {
            background: #f8f9fa;
            padding: 25px;
            border-radius: 15px;
            margin: 20px 0;
            display: none;
        }
        
        .preview.show {
            display: block;
        }
        
        .category-box {
            background: white;
            padding: 20px;
            border-radius: 10px;
            margin-bottom: 15px;
            border-right: 4px solid #2a5298;
        }
        
        .category-box h4 {
            color: #1e3c72;
            margin-bottom: 10px;
        }
        
        .category-box li {
            padding: 8px 0;
            color: #555;
        }
        
        .buttons {
            display: flex;
            gap: 15px;
            margin-top: 30px;
        }
        
        .btn {
            flex: 1;
            padding: 20px;
            border: none;
            border-radius: 12px;
            font-size: 1.3em;
            font-weight: bold;
            cursor: pointer;
            transition: all 0.3s;
        }
        
        .btn-analyze {
            background: white;
            color: #2a5298;
            border: 3px solid #2a5298;
        }
        
        .btn-analyze:hover {
            background: #f0f0f0;
        }
        
        .btn-generate {
            background: linear-gradient(135deg, #1e3c72 0%, #2a5298 100%);
            color: white;
        }
        
        .btn-generate:hover:not(:disabled) {
            transform: translateY(-3px);
            box-shadow: 0 10px 30px rgba(30, 60, 114, 0.4);
        }
        
        .btn:disabled {
            opacity: 0.5;
            cursor: not-allowed;
        }
        
        .message {
            padding: 15px;
            border-radius: 10px;
            margin: 20px 0;
            text-align: center;
            font-weight: bold;
            display: none;
        }
        
        .message.show {
            display: block;
        }
        
        .message.success {
            background: #d4edda;
            color: #155724;
        }
        
        .message.error {
            background: #f8d7da;
            color: #721c24;
        }
        
        .message.info {
            background: #d1ecf1;
            color: #0c5460;
        }
        
        .message.warning {
            background: #fff3cd;
            color: #856404;
            border: 2px solid #ffc107;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>🔍 User Feedback Analyzer & Automated PowerPoint Generator</h1>
            <p>تحليل ملاحظات الزائر السري وإنشاء التقارير تلقائياً</p>
        </div>
        
        <div class="content">
            <div style="background: #f8f9fa; padding: 25px; border-radius: 15px; margin-bottom: 20px;">
                <label style="display: block; font-weight: bold; margin-bottom: 10px; font-size: 1.1em;">
                    📝 ألصق كل الملاحظات هنا:
                </label>
                <textarea id="notesInput" placeholder="الصق كل النص هنا..."></textarea>

            </div>
            
            <div class="stats" id="stats">
                <div class="stat-card">
                    <div class="stat-number" id="totalNotes">0</div>
                    <div class="stat-label">إجمالي الملاحظات</div>
                </div>
                <div class="stat-card">
                    <div class="stat-number" id="categoriesCount">0</div>
                    <div class="stat-label">عدد الفئات</div>
                </div>
                <div class="stat-card">
                    <div class="stat-number" id="subcategoriesCount">0</div>
                    <div class="stat-label">عدد الفئات الفرعية</div>
                </div>
            </div>
            
            <div class="preview" id="preview">
                <h3 style="color: #1e3c72; margin-bottom: 20px;">👁️ معاينة التصنيف (حسب الفئة الفرعية)</h3>
                <div id="previewContent"></div>
            </div>
            
            <div class="buttons">
                <button class="btn btn-analyze" onclick="analyzeNotes()">
                    🔍 تحليل الملاحظات
                </button>
                <button class="btn btn-generate" onclick="generatePPT()" id="generateBtn" disabled>
                    🚀 إنشاء بوربوينت
                </button>
            </div>
            
            <div class="message" id="message"></div>
        </div>
    </div>
    
    <script>
        let analyzedData = null;
        

        function analyzeNotes() {
            const text = document.getElementById('notesInput').value.trim();
            
            if (!text) {
                showMessage('error', '⚠️ يرجى إدخال النص');
                return;
            }
            
            showMessage('info', '⏳ جاري التحليل...');
            
            try {
                analyzedData = parseNotes(text);
                
                if (analyzedData.totalNotes === 0) {
                    showMessage('error', '⚠️ لم يتم العثور على ملاحظات');
                    return;
                }
                
                displayPreview(analyzedData);
                updateStats(analyzedData);
                document.getElementById('generateBtn').disabled = false;
                showMessage('success', `✅ تم استخراج ${analyzedData.totalNotes} ملاحظة في ${analyzedData.subcategoriesCount} فئة فرعية!`);
            } catch (error) {
                showMessage('error', '❌ خطأ: ' + error.message);
                console.error(error);
            }
        }
        
        function parseNotes(text) {
            // تنظيف النص من المسافات الزائدة والأحرف الخفية
            text = text.replace(/\u200F/g, '');
            text = text.replace(/\u00A0/g, ' '); // مسافة غير قابلة للكسر
            
            // تقسيم النص إلى أسطر
            const lines = text.split(/\r?\n/).map(l => l.trim()).filter(l => l);
            
            let ticketId = '';
            let hospital = '';
            const categories = {};
            let totalNotes = 0;
            
            console.log('عدد الأسطر:', lines.length);
            
            // البحث عن معلومات أساسية
            for (let line of lines) {
                // البحث عن رقم التذكرة (صيغ متعددة)
                // مثال: NHC-MV-12345 أو #12345 أو رقم التذكرة: 12345
                if (!ticketId) {
                    // صيغة NHC-MV-xxx
                    let match = line.match(/NHC[\s-]*MV[\s-]*\d+/i);
                    if (match) {
                        ticketId = match[0].replace(/\s+/g, '');
                    }
                    // صيغة #xxx أو رقم التذكرة: xxx
                    else {
                        match = line.match(/(?:رقم التذكرة|التذكرة|Ticket|#)\s*:?\s*([A-Z0-9\-]+)/i);
                        if (match) {
                            ticketId = match[1];
                        }
                    }
                }
                // البحث عن اسم المستشفى/المركز
                if ((line.includes('مركز') || line.includes('مستشفى')) && !line.includes('(') && !hospital) {
                    hospital = line.trim();
                    console.log('تم العثور على المنشأة:', hospital);
                }
            }
            
            // استخراج الملاحظات
            for (let line of lines) {
                // تخطي السطور القصيرة جداً
                if (line.length < 15) continue;
                
                // تخطي السطور التي هي معلومات فقط (بس اسم المستشفى، مش رقم التذكرة!)
                if ((line.includes('مركز') || line.includes('مستشفى')) && 
                    !line.includes('(') && 
                    !line.match(/NHC/)) {
                    continue;
                }
                
                // البحث عن الملاحظات - يجب أن تحتوي على قوسين
                if (line.includes('(') && line.includes(')')) {
                    
                    // محاولة استخراج البيانات
                    let category = '';
                    let subCategory = '';
                    let observation = '';
                    let repeatCount = 1;
                    
                    // Pattern: "في الفئة ( الفئة الفرعية ) الملاحظة..."
                    // أو: "الفئة ( الفئة الفرعية ) الملاحظة..."
                    const patterns = [
                        /^في\s+([^(]+)\s*\(\s*([^)]+)\s*\)\s*(.+)/,  // يبدأ بـ "في"
                        /^([^(]+)\s*\(\s*([^)]+)\s*\)\s*(.+)/         // بدون "في"
                    ];
                    
                    let matched = false;
                    for (let pattern of patterns) {
                        const match = line.match(pattern);
                        if (match) {
                            category = match[1].trim().replace(/^في\s+/, '');
                            subCategory = match[2].trim();
                            observation = match[3].trim();
                            matched = true;
                            break;
                        }
                    }
                    
                    if (!matched) {
                        console.log('لم يتم تحليل السطر:', line.substring(0, 50));
                        continue;
                    }
                    
                    // تنظيف الملاحظة
                    observation = observation.replace(/PX[A-Z]*/gi, '');
                    observation = observation.replace(/\(\s*عدد\s*التكرار\s*=\s*\d+\s*\)/g, '');
                    observation = observation.trim();
                    
                    // استخراج عدد التكرار
                    const repeatMatch = line.match(/عدد\s*التكرار\s*=\s*(\d+)/);
                    if (repeatMatch) {
                        repeatCount = parseInt(repeatMatch[1]);
                    }
                    
                    // التحقق من وجود بيانات صالحة
                    if (category && observation && observation.length > 3) {
                        if (!categories[category]) {
                            categories[category] = [];
                        }
                        
                        categories[category].push({
                            subCategory: subCategory || 'عام',
                            observation: observation,
                            repeatCount: repeatCount
                        });
                        
                        totalNotes++;
                        console.log(`تم استخراج: ${category} (${subCategory})`);
                    }
                }
            }
            
            // حساب عدد الفئات الفرعية
            const subcategories = new Set();
            for (const notes of Object.values(categories)) {
                for (const note of notes) {
                    subcategories.add(note.subCategory);
                }
            }
            
            console.log('إجمالي الملاحظات المستخرجة:', totalNotes);
            console.log('عدد الفئات:', Object.keys(categories).length);
            console.log('عدد الفئات الفرعية:', subcategories.size);
            
            return {
                ticketId: ticketId || 'غير محدد',
                hospital: hospital || 'غير محدد',
                categories: categories,
                totalNotes: totalNotes,
                subcategoriesCount: subcategories.size
            };
        }
        
        function displayPreview(data) {
            const preview = document.getElementById('preview');
            const content = document.getElementById('previewContent');
            
            let html = '';
            
            html += `<div style="background: white; padding: 15px; border-radius: 10px; margin-bottom: 20px; border-right: 4px solid #0066cc;">
                <strong>🏥 المنشأة:</strong> ${data.hospital}<br>
                <strong>📋 رقم التذكرة:</strong> ${data.ticketId}
            </div>`;
            
            // تجميع حسب الفئة الفرعية
            const bySubcategory = {};
            for (const [category, notes] of Object.entries(data.categories)) {
                for (const note of notes) {
                    const key = `${category} ( ${note.subCategory} )`;
                    if (!bySubcategory[key]) bySubcategory[key] = [];
                    bySubcategory[key].push({...note, category});
                }
            }
            
            for (const [subcategoryFull, notes] of Object.entries(bySubcategory)) {
                html += `<div class="category-box">
                    <h4>📋 ${subcategoryFull} (${notes.length} ملاحظة)</h4>
                    <ul style="list-style: none; padding-right: 15px;">`;
                
                notes.forEach(note => {
                    const repeat = note.repeatCount > 1 ? ` <strong style="color: #e74c3c;">(تكرر ${note.repeatCount} مرة)</strong>` : '';
                    html += `<li>• ${note.observation}${repeat}</li>`;
                });
                
                html += `</ul></div>`;
            }
            
            content.innerHTML = html;
            preview.classList.add('show');
        }
        
        function updateStats(data) {
            document.getElementById('totalNotes').textContent = data.totalNotes;
            document.getElementById('categoriesCount').textContent = Object.keys(data.categories).length;
            document.getElementById('subcategoriesCount').textContent = data.subcategoriesCount;
            document.getElementById('stats').classList.add('show');
        }
        
        async function generatePPT() {
            if (!analyzedData || analyzedData.totalNotes === 0) {
                showMessage('error', '⚠️ يرجى تحليل الملاحظات أولاً');
                return;
            }
            
            document.getElementById('generateBtn').disabled = true;
            showMessage('info', '⏳ جاري إنشاء البوربوينت...');
            
            try {
                const response = await fetch('/generate-pptx', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                    },
                    body: JSON.stringify(analyzedData)
                });
                
                if (!response.ok) {
                    const error = await response.json();
                    throw new Error(error.error || 'فشل إنشاء البوربوينت');
                }
                
                const disposition = response.headers.get('Content-Disposition');
                let filename = 'تقرير.pptx';
                if (disposition) {
                    const match = disposition.match(/filename\*?=(?:UTF-8'')?["']?([^"';\n]+)["']?/i);
                    if (match) filename = decodeURIComponent(match[1]);
                }
                
                const blob = await response.blob();
                const url = window.URL.createObjectURL(blob);
                const a = document.createElement('a');
                a.href = url;
                a.download = filename;
                document.body.appendChild(a);
                a.click();
                window.URL.revokeObjectURL(url);
                document.body.removeChild(a);
                
                showMessage('success', '✅ تم إنشاء البوربوينت بنجاح!');
            } catch (error) {
                showMessage('error', '❌ خطأ: ' + error.message);
                console.error(error);
            } finally {
                document.getElementById('generateBtn').disabled = false;
            }
        }
        
        function showMessage(type, text) {
            const message = document.getElementById('message');
            message.className = 'message show ' + type;
            message.textContent = text;
            
            if (type !== 'info') {
                setTimeout(() => message.classList.remove('show'), 5000);
            }
        }
    </script>
</body>
</html>
